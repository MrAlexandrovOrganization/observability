apiVersion: 1

groups:
  - orgId: 1
    name: containers
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: container-memory-high
        title: ContainerMemoryHigh
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: >
                (container_memory_working_set_bytes{name!=""}
                / container_spec_memory_limit_bytes{name!=""})
                and container_spec_memory_limit_bytes{name!=""} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [0.8]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "{{ $labels.name }}: память высокая"
        labels:
          severity: warning
        isPaused: false

      - uid: container-memory-critical
        title: ContainerMemoryCritical
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: >
                (container_memory_working_set_bytes{name!=""}
                / container_spec_memory_limit_bytes{name!=""})
                and container_spec_memory_limit_bytes{name!=""} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [0.9]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "{{ $labels.name }}: память критическая — риск OOM"
        labels:
          severity: critical
        isPaused: false
