apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: "<TELEGRAM_BOT_TOKEN>"
          chatid: "<TELEGRAM_CHAT_ID>"
          message: |
            {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b>

            Severity: {{ .CommonLabels.severity }}
            {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          parse_mode: HTML
        disableResolveMessage: false
