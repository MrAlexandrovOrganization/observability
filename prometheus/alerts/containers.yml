groups:
  - name: containers
    rules:
      - alert: ContainerMemoryHigh
        expr: |
          (container_memory_working_set_bytes{name!=""}
           / container_spec_memory_limit_bytes{name!=""})
          > 0.8
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }}: память {{ $value | humanizePercentage }}"

      - alert: ContainerMemoryCritical
        expr: |
          (container_memory_working_set_bytes{name!=""}
           / container_spec_memory_limit_bytes{name!=""})
          > 0.9
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }}: память {{ $value | humanizePercentage }} — риск OOM"
