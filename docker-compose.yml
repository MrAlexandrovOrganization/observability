networks:
  monitoring-net:
    name: monitoring-net

services:
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
    networks:
      - monitoring-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          memory: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DATA_DIR}/prometheus-targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring-net
    depends_on:
      - cadvisor
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DATA_DIR}/grafana-dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=marcusolsson-calendar-panel
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  prometheus_data:
  grafana_data:
