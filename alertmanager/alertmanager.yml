route:
  receiver: telegram
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  group_by: [alertname, severity]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "<TELEGRAM_BOT_TOKEN>"
        chat_id: <TELEGRAM_CHAT_ID>
        parse_mode: HTML
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b>
          Статус: {{ .Status | toUpper }}
          Severity: {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ end }}
